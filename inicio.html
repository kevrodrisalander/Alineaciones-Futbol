<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bosque 2D - Talador y Constructor</title>
    <meta name="csrf-token" content="{{ csrf_token() }}" />

    <style>
      :root {
        --verde-oscuro: rgb(46, 111, 64);
        --verde-medio: rgb(68, 99, 63);
        --verde-claro: rgb(141, 181, 128);
        --madera: rgb(80, 50, 35);
        --tierra: rgb(55, 45, 35);
        --luz-dorada: rgb(255, 225, 86);
      }

      body {
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      /* Panel superior de Inventario */
      #ui-panel {
        background-color: var(--tierra);
        border: 3px solid var(--madera);
        padding: 10px 20px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .contador {
        font-size: 18px;
        font-weight: bold;
        color: var(--luz-dorada);
      }

      button {
        background-color: var(--verde-oscuro);
        color: white;
        border: 2px solid var(--verde-claro);
        padding: 8px 15px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 4px;
      }

      button:hover {
        background-color: var(--verde-claro);
        color: black;
      }

      /* Lienzo del Juego 2D */
      #gameCanvas {
        border: 4px solid var(--tierra);
        border-radius: 8px;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.6);
        background-color: var(--verde-medio);
      }

      .instrucciones {
        margin-top: 10px;
        font-size: 14px;
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <!-- Interfaz de Usuario: Contador de Madera y Botón de Construcción -->
    <div id="ui-panel">
      <div class="contador">🪵 Madera: <span id="madera-count">0</span></div>
      <button onclick="construirCasa()">
        🏠 Construir Casa (Cuesta 10 Madera)
      </button>
    </div>

    <!-- Lienzo donde se dibuja el juego 2D -->
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="instrucciones">
      Controles: Usa las **Flechas del teclado** o **WASD** para moverte.
      Acércate a un árbol y presiona **ESPACIO** para talar.
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const maderaCountEl = document.getElementById("madera-count");

      // Estado del Juego
      let madera = 0;
      const teclas = {};

      // Jugador
      const jugador = {
        x: 300,
        y: 200,
        radio: 12,
        velocidad: 3,
        color: "#3498db", // Azul para destacar
      };

      // Arboles iniciales en el bosque
      let arboles = [
        { x: 100, y: 100, vida: 3 },
        { x: 450, y: 120, vida: 3 },
        { x: 150, y: 300, vida: 3 },
        { x: 500, y: 280, vida: 3 },
        { x: 300, y: 80, vida: 3 },
      ];

      // Casas construidas
      let casas = [];

      // Detectar teclas presionadas
      window.addEventListener("keydown", (e) => {
        teclas[e.key] = true;
        if (e.key === " ") {
          talarArbol();
        }
      });

      window.addEventListener("keyup", (e) => {
        teclas[e.key] = false;
      });

      // Lógica de Movimiento del Jugador
      function actualizarJugador() {
        if (
          (teclas["ArrowUp"] || teclas["w"] || teclas["W"]) &&
          jugador.y - jugador.radio > 0
        ) {
          jugador.y -= jugador.velocidad;
        }
        if (
          (teclas["ArrowDown"] || teclas["s"] || teclas["S"]) &&
          jugador.y + jugador.radio < canvas.height
        ) {
          jugador.y += jugador.velocidad;
        }
        if (
          (teclas["ArrowLeft"] || teclas["a"] || teclas["A"]) &&
          jugador.x - jugador.radio > 0
        ) {
          jugador.x -= jugador.velocidad;
        }
        if (
          (teclas["ArrowRight"] || teclas["d"] || teclas["D"]) &&
          jugador.x + jugador.radio < canvas.width
        ) {
          jugador.x += jugador.velocidad;
        }
      }

      // Talar Árbol
      function talarArbol() {
        arboles.forEach((arbol, index) => {
          // Calcular distancia entre el jugador y el árbol
          const dx = jugador.x - arbol.x;
          const dy = jugador.y - arbol.y;
          const distancia = Math.sqrt(dx * dx + dy * dy);

          // Si está lo suficientemente cerca (menos de 40px)
          if (distancia < 40) {
            arbol.vida -= 1;
            if (arbol.vida <= 0) {
              // Eliminar árbol y dar madera
              arboles.splice(index, 1);
              madera += 5;
              maderaCountEl.textContent = madera;
              guardarMaderaEnLaravel(madera);
            }
          }
        });
      }

      // Construir Casa
      function construirCasa() {
        if (madera >= 10) {
          madera -= 10;
          maderaCountEl.textContent = madera;

          // Construir casa cerca del jugador
          casas.push({ x: jugador.x, y: jugador.y });
          guardarMaderaEnLaravel(madera);
        } else {
          alert("¡Necesitas al menos 10 de madera para construir una casa!");
        }
      }

      // Renderizado (Dibujar en Canvas 2D)
      // --- COPIAR DESDE AQUÍ Y REEMPLAZAR LA FUNCIÓN DIBUJAR() ANTERIOR ---

      // Renderizado Mejorado (Dibujar en Canvas 2D)
      function dibujar() {
        // 1. Limpiar pantalla con el piso verde medio RGB(68, 99, 63)
        ctx.fillStyle = "rgb(68, 99, 63)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Dibujar Casas (Marrón Madera RGB(80, 50, 35))
        casas.forEach((casa) => {
          ctx.fillStyle = "rgb(80, 50, 35)";
          ctx.fillRect(casa.x - 20, casa.y - 20, 40, 35); // Cuerpo de la casa

          // Techo de la casa (Luz dorada RGB(255, 225, 86))
          ctx.fillStyle = "rgb(255, 225, 86)";
          ctx.beginPath();
          ctx.moveTo(casa.x - 25, casa.y - 20); // Esquina inferior izquierda del techo
          ctx.lineTo(casa.x, casa.y - 40); // Punta superior del techo
          ctx.lineTo(casa.x + 25, casa.y - 20); // Esquina inferior derecha del techo
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgb(55, 45, 35)"; // Borde oscuro para el techo
          ctx.stroke();
        });

        // 3. Dibujar Árboles con Follaje Orgánico (Mejorado)
        arboles.forEach((arbol) => {
          dibujarArbolOrganico(ctx, arbol.x, arbol.y, arbol.vida);
        });

        // 4. Dibujar Jugador (Personaje)
        ctx.fillStyle = jugador.color;
        ctx.beginPath();
        ctx.arc(jugador.x, jugador.y, jugador.radio, 0, Math.PI * 2);
        ctx.fill();

        // Dibujar Hacha en la mano del jugador (Luz dorada RGB(255, 225, 86))
        ctx.fillStyle = "rgb(255, 225, 86)";
        ctx.fillRect(jugador.x + 8, jugador.y - 4, 8, 4);
      }

      // Nueva Función para dibujar árboles más realistas usando nubes de círculos
      function dibujarArbolOrganico(context, x, y, vida) {
        context.save();

        // Efecto de temblor al golpear
        if (vida < 3) {
          const intensidad = (3 - vida) * 2;
          context.translate(
            (Math.random() - 0.5) * intensidad,
            (Math.random() - 0.5) * intensidad,
          );
        }

        // --- 1. Tronco y Raíces (Madera y Tierra) ---
        context.fillStyle = "rgb(80, 50, 35)";
        context.fillRect(x - 6, y - 5, 12, 28); // Tronco principal

        // Base con raíces
        context.fillStyle = "rgb(55, 45, 35)";
        context.beginPath();
        context.moveTo(x - 10, y + 23);
        context.lineTo(x - 6, y + 10);
        context.lineTo(x + 6, y + 10);
        context.lineTo(x + 10, y + 23);
        context.closePath();
        context.fill();

        // --- 2. Capas de Pino (Triángulos superpuestos de abajo hacia arriba) ---
        const capasPino = [
          { yBase: y + 2, ancho: 42, alto: 30 }, // Capa inferior (más ancha)
          { yBase: y - 15, ancho: 34, alto: 28 }, // Capa media
          { yBase: y - 30, ancho: 26, alto: 24 }, // Capa superior
          { yBase: y - 44, ancho: 16, alto: 20 }, // Punta del pino
        ];

        capasPino.forEach((capa) => {
          // Base de la capa (Verde Oscuro RGB)
          context.fillStyle = "rgb(46, 111, 64)";
          context.beginPath();
          context.moveTo(x - capa.ancho / 2, capa.yBase);
          context.lineTo(x, capa.yBase - capa.alto);
          context.lineTo(x + capa.ancho / 2, capa.yBase);
          context.closePath();
          context.fill();

          // Destello de luz en la izquierda de cada capa (Verde Claro RGB)
          context.fillStyle = "rgb(141, 181, 128)";
          context.beginPath();
          context.moveTo(x - capa.ancho / 2, capa.yBase);
          context.lineTo(x - 2, capa.yBase - capa.alto + 5);
          context.lineTo(x, capa.yBase);
          context.closePath();
          context.fill();
        });

        context.restore();
      }

      // --- TERMINAR DE COPIAR AQUÍ ---

      // Bucle Principal del Juego (60 FPS)
      function gameLoop() {
        actualizarJugador();
        dibujar();
        requestAnimationFrame(gameLoop);
      }

      // Petición opcional para comunicar con el backend Laravel
      function guardarMaderaEnLaravel(cantidad) {
        const token = document
          .querySelector('meta[name="csrf-token"]')
          .getAttribute("content");
        fetch("/api/guardar-madera", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-TOKEN": token,
          },
          body: JSON.stringify({ madera: cantidad }),
        })
          .then((res) => res.json())
          .then((data) => console.log("Guardado en servidor:", data))
          .catch((err) => console.log("Sin conexión con servidor aún"));
      }

      // Iniciar el bucle
      gameLoop();

      const detallesPiso = [];
      for (let i = 0; i < 40; i++) {
        detallesPiso.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          tipo: Math.random() > 0.4 ? "hierba" : "piedra",
        });
      }

      // Dibujar matojo de hierba con Verde Claro RGB(141, 181, 128)
      function dibujarHierba(context, x, y) {
        context.strokeStyle = "rgb(141, 181, 128)";
        context.lineWidth = 2;
        context.beginPath();
        // Brizna izquierda
        context.moveTo(x, y);
        context.lineTo(x - 4, y - 7);
        // Brizna central
        context.moveTo(x, y);
        context.lineTo(x, y - 9);
        // Brizna derecha
        context.moveTo(x, y);
        context.lineTo(x + 4, y - 6);
        context.stroke();
      }

      // Dibujar piedra con tono Tierra RGB(55, 45, 35) y textura
      function dibujarPiedra(context, x, y) {
        // Sombra / Base de la piedra
        context.fillStyle = "rgb(55, 45, 35)";
        context.beginPath();
        context.ellipse(x, y, 6, 4, 0, 0, Math.PI * 2);
        context.fill();

        // Brillo superior (Marrón Madera RGB(80, 50, 35))
        context.fillStyle = "rgb(80, 50, 35)";
        context.beginPath();
        context.ellipse(x - 1, y - 1, 3, 2, 0, 0, Math.PI * 2);
        context.fill();
      }
    </script>
  </body>
</html>
