<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071d16">
    <title>Pizarra Táctica de Fútbol Pro</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/cancha.css">
    <link rel="stylesheet" href="css/panel.css">
</head>
<body>
    <main class="app">
        <header class="encabezado">
            <div>
                <p class="eyebrow">Pizarra Táctica Profesional</p>
                <h1 id="titulo-esquema">Alineación Táctica</h1>
            </div>
            <div class="marcador-cambios">
                <span>Cambios Realizados:</span>
                <span class="badge-cambios" id="contador-cambios">0 / 5</span>
            </div>
        </header>

        <div class="contenido">
            <!-- Cancha de fútbol -->
            <section class="marco-cancha" aria-label="Cancha de fútbol" aria-describedby="instrucciones-cancha">
                <p class="instrucciones-cancha" id="instrucciones-cancha">
                    Selecciona o arrastra un jugador. Con el teclado, usa las flechas para moverlo.
                </p>
                <div class="cancha" id="cancha" role="group" aria-label="Jugadores titulares">
                    <div class="linea"></div>
                    <div class="circulo-central"></div>
                    <div class="area superior"></div>
                    <div class="area inferior"></div>
                    <div class="porteria superior"></div>
                    <div class="porteria inferior"></div>
                </div>
            </section>

            <!-- Panel de Control y Banca -->
            <aside class="panel">
                <!-- Gestión de Formación y Edición -->
                <div class="seccion-card">
                    <h2>Configuración Táctica</h2>
                    
                    <div class="campo-grupo">
                        <label for="selectFormacion">Estructura de Juego</label>
                        <select id="selectFormacion">
                            <option value="4-3-3">4-3-3 (Ofensiva con extremos)</option>
                            <option value="4-4-2">4-4-2 (Equilibrada clásica)</option>
                            <option value="4-2-3-1">4-2-3-1 (Doble pivote y mediapunta)</option>
                            <option value="3-5-2">3-5-2 (Carrileros y 3 centrales)</option>
                            <option value="5-3-2">5-3-2 (Bloque defensivo sólido)</option>
                            <option value="4-1-4-1">4-1-4-1 (Pivote defensivo y presión)</option>
                        </select>
                    </div>

                    <div class="campo-grupo">
                        <label for="selectLiga">Liga o Competición</label>
                        <select id="selectLiga"></select>
                    </div>

                    <div class="campo-grupo">
                        <label for="selectCamisa">Equipo (Camisa)</label>
                        <div class="selector-camisa">
                            <span class="vista-camisa" id="vistaCamisa" aria-hidden="true"></span>
                            <select id="selectCamisa"></select>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <span class="etiqueta-grupo">Plantilla</span>
                        <p class="plantilla-actual" id="textoPlantilla"></p>
                        <div class="acciones-plantilla">
                            <button id="btnPlantillaEquipo" class="secundario" type="button">Cargar plantilla del equipo</button>
                            <button id="btnPlantillaBlanco" class="secundario" type="button">Plantilla en blanco</button>
                        </div>
                    </div>

                    <form id="formulario">
                        <div class="campo-grupo">
                            <label for="nombreJugador">Editar Jugador Seleccionado</label>
                            <input id="nombreJugador" maxlength="20" autocomplete="off" disabled placeholder="Haz clic en un jugador">
                        </div>
                        <div class="campo-grupo">
                            <label for="posicionJugador">Posición Táctica</label>
                            <input id="posicionJugador" maxlength="15" autocomplete="off" disabled placeholder="Ej. Extremo Der.">
                        </div>
                        <div class="acciones acciones-formulario">
                            <button id="guardar" type="submit" disabled>Guardar Nombre y Posición</button>
                            <button id="btnSustituir" class="boton-sub" type="button" disabled>Realizar Cambio (0/5)</button>
                        </div>
                        <button id="btnCapitan" class="btn-capitan" type="button" disabled>Asignar Capitán</button>
                    </form>
                </div>

                <!-- Banca de Suplentes (Jugadores 12 al 24) -->
                <div class="seccion-card">
                    <h2>
                        Banca de Suplentes 
                        <span class="banca-disponibles">(13 Disponibles)</span>
                    </h2>
                    <div class="banca-grid" id="bancaGrid">
                        <!-- Generado por JS -->
                    </div>
                </div>

                <div class="acciones">
                    <button class="secundario" id="restablecer" type="button">Restablecer Formación y Cambios</button>
                </div>
                <div class="estado" id="estado" role="status" aria-live="polite">Los cambios de nombres y posiciones se guardan automáticamente.</div>
            </aside>
        </div>
    </main>

    <script src="camisas.js"></script>
    <script src="plantillas.js"></script>
    <script src="alineacion.js"></script>
</body>
</html>
